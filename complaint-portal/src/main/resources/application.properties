spring.application.name=complaint-portal

# ---- DB config ----
spring.datasource.url=jdbc:mysql://localhost:3306/complaint_portal_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT config ----
# change this secret before deploying, keep it 256-bit+
jwt.secret=change_this_to_a_long_random_secret_key_before_prod_1234567890
jwt.expiration.ms=86400000

# ---- File upload config ----
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Gemini config ----
# get a free key from https://aistudio.google.com/apikey
# ---- Gemini config ----
# ---- Gemini config ----
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
# creates the default departments + this one commissioner account on first startup only
seed.commissioner.email=commissioner@nagrikseva.gov.in
seed.commissioner.password=ChangeMe@123

# add this block to application.properties, before server.port

# ---- Email (SMTP) config ----
# Gmail example: use an App Password (not your normal password) - https://myaccount.google.com/apppasswords
# set the two env vars below, or just hardcode them here for local dev
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from-name=Nagrik Seva
app.mail.enabled=true
# used to build "view your complaint" links inside emails
app.frontend-url=http://localhost:5173

server.port=8080