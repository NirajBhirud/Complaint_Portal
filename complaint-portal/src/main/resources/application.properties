spring.application.name=complaint-portal

# =========================================================

# DATABASE

# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/complaint_portal_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================

# JWT

# =========================================================

# Change this secret before production.

jwt.secret=change_this_to_a_long_random_secret_key_before_prod_1234567890

jwt.expiration.ms=86400000

# =========================================================

# FILE UPLOAD

# =========================================================

file.upload-dir=./uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================

# GEMINI AI

# =========================================================

# Gemini API key is read from environment variable.

gemini.api.key=${GEMINI_API_KEY}

# Primary Gemini model

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# Fallback model

gemini.api.fallback.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# =========================================================

# COMMISSIONER SEED

# =========================================================

# Creates the default departments + commissioner account

# on first startup only.

seed.commissioner.email=[commissioner@nagrikseva.gov.in](mailto:commissioner@nagrikseva.gov.in)
seed.commissioner.password=ChangeMe@123

# =========================================================

# EMAIL / SMTP

# =========================================================

# Gmail SMTP configuration.

#

# IMPORTANT:

# MAIL_USERNAME = your Gmail address

# MAIL_APP_PASSWORD = Gmail App Password

#

# Do NOT use your normal Gmail password.

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# =========================================================

# APPLICATION EMAIL SETTINGS

# =========================================================

app.mail.from-name=Nagrik Seva

app.mail.enabled=true

# Used for "View complaint" links in emails.

app.frontend-url=http://localhost:5173

# =========================================================

# SERVER

# =========================================================

server.port=8080
